<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello from Simona - week 3 assignment</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 1rem;
        padding: 2rem 1rem;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #ffffff;
        color: #111111;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 1rem;
        word-break: break-all;
      }
      a {
        color: #1a5fd0;
      }
      .gallery {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        width: 100%;
        max-width: 900px;
        margin-top: 2rem;
      }
      figure {
        margin: 0;
      }
      figure img {
        width: 100%;
        height: auto;
        border: 1px solid #e2e2e2;
        border-radius: 8px;
      }
      figcaption {
        margin-top: 0.75rem;
        font-size: 1rem;
        color: #333333;
      }

  </head>
  <body>
    <h1>Hello from Simona - week 3 assignment</h1>
    <p>
      Public repo URL:
      <a href="https://github.com/sisa-rite/CS-shoracko26-week3">
        https://github.com/sisa-rite/CS-shoracko26-week3
      </a>
    </p>

    <div class="gallery">
      <figure>
        <img
          src="https://a3s.fi/swift/v1/shoracko-week3-media/enable-allas.png"
          alt="Enabling the Allas service in my CSC project"
        />
        <figcaption>
          First I enabled the Allas object storage service in my CSC project so
          that the project could start using buckets.
        </figcaption>
      </figure>

      <figure>
        <img
          src="https://a3s.fi/swift/v1/shoracko-week3-media/new-bucket.png"
          alt="Creating a new bucket on Allas"
        />
        <figcaption>
          Then I created a new bucket on Allas and made it public, so the files
          inside it can be served over a plain URL.
        </figcaption>
      </figure>

      <figure>
        <img
          src="https://a3s.fi/swift/v1/shoracko-week3-media/my-code.png"
          alt="Sample of my code"
        />
        <figcaption>
          Finally, here is a sample of my code - the HTML page that is built into
          the container image and served by the web server.
        </figcaption>
      </figure>
